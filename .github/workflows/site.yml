# Publishes the website in site/ on GitHub Pages:
# https://lennylenders.github.io/PleaseNoBugs/
#
# On a version tag, like the container image, because the code the site hands
# out loads that version from npm: the site must not go out before the
# release it points at. For a change to the site alone, run it by hand under
# Actions → Website → Run workflow.
#
# Once, before the first run: Settings → Pages → Source: "GitHub Actions".

name: Website

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node site/build.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
